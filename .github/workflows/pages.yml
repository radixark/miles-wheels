name: Publish the pip index

# A PEP 503 index over the sglang-miles wheels here and the miles wheels on radixark/miles
# releases, served from GitHub Pages at https://radixark.github.io/miles-wheels/simple/.
# Rebuilt hourly after build-wheels.yml's sglang job, and on dispatch from release-wheel.yml.

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [build_index.py, .github/workflows/pages.yml]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # an admin turns Pages on under Settings > Pages (source: GitHub Actions); until then the
      # deployment API answers 404 and every hourly run would fail
      - name: Is GitHub Pages enabled?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GitHub Pages is not enabled on ${GITHUB_REPOSITORY}; the index was built but not published"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the index
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 build_index.py --out site/simple \
            --releases radixark/miles-wheels:sglang-miles- \
            --releases radixark/miles:v

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
